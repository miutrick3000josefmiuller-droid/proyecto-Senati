<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Portal – Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="assets/icons/image.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<main class="card">
  <button class="close" type="button" aria-label="Close" id="close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
  </button>

  <svg class="logo" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
    <path d="M18 14h28c8 0 12 6 14 16l3 16c1 6-3 10-8 10-4 0-7-2-9-6l-3-5H21l-3 5c-2 4-5 6-9 6-5 0-9-4-8-10l3-16c2-10 6-16 14-16z"/>
    <g fill="#1f1d4d">
      <rect x="17" y="25" width="4" height="12" rx="1"/><rect x="13" y="29" width="12" height="4" rx="1"/>
      <circle cx="43" cy="26" r="2.6"/><circle cx="49" cy="32" r="2.6"/><circle cx="37" cy="32" r="2.6"/><circle cx="43" cy="38" r="2.6"/>
    </g>
  </svg>

  <h1>GAME PORTAL</h1>
  <p class="tagline">Enter the digital realm</p>

  <form id="login" novalidate>
    <div class="field">
      <label for="user">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 5h20v14H2z"/><path d="M2 6l10 7 10-7" fill="none" stroke="#1f1d4d" stroke-width="1.6"/></svg>
        Email or username
      </label>
      <div class="input-wrap">
        <input type="text" id="user" name="user" autocomplete="username" aria-describedby="user-err">
      </div>
      <p class="error" id="user-err" role="alert"></p>
    </div>

    <div class="field">
      <label for="pass">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3h1.5a1 1 0 011 1v10a1 1 0 01-1 1h-13a1 1 0 01-1-1V11a1 1 0 011-1H7zm2 0h6V7a3 3 0 00-6 0v3z"/></svg>
        Password
      </label>
      <div class="input-wrap">
        <input type="password" id="pass" name="pass" autocomplete="current-password" aria-describedby="pass-err">
        <button class="toggle" type="button" id="toggle" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M3 3l18 18"/>
          </svg>
        </button>
      </div>
      <p class="error" id="pass-err" role="alert"></p>
    </div>

    <div class="row">
      <label class="remember"><input type="checkbox" id="remember" name="remember"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="submit" type="submit" id="submit">
      <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M18 14h28c8 0 12 6 14 16l3 16c1 6-3 10-8 10-4 0-7-2-9-6l-3-5H21l-3 5c-2 4-5 6-9 6-5 0-9-4-8-10l3-16c2-10 6-16 14-16z"/></svg>
      Enter game
    </button>
    <p class="status" id="status" role="status"></p>
  </form>

  <p class="divider">Or continue with</p>
  <div class="social">
    <button type="button" data-provider="google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.7h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3zM12 22c2.7 0 5-.9 6.6-2.5l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0012 22zM6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 000 9.2L6.4 14zM12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 003.1 7.4L6.4 10C7.2 7.7 9.4 5.9 12 5.9z"/></svg>
        GOOGLE
      </button>
      <button type="button" data-provider="discord">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.3 5.3A17 17 0 0015 4l-.2.4a15 15 0 013.7 1.9 13 13 0 00-13 0A15 15 0 019.200 4.400L9 4a17 17 0 00-4.300 1.300C2 9.300 1.300 13.200 1.600 17a17 17 0 005.200 2.600l1.100-1.800-1.700-.8.400-.3a12 12 0 0010.800 0l.4.300-1.700.8 1.100 1.800A17 17 0 0022.400 17c.4-4.400-.7-8.300-3.100-11.700zM8.700 14.700c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6.600 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg>
        DISCORD
      </button>
    </div>
  </div>

  <p class="signup">New to the game? <a href="#">Create account</a></p>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
